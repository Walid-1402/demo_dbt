version: 2                                   # Format-Version der YAML-Datei (immer 2)

sources:                                     # hier werden Datenquellen definiert
  - name: COVID19_Epidemiological_Data       # Name, unter dem wir die Quelle in dbt aufrufen
    description: 'Ceci est un test.'         # Beschreibung der Quelle
    database: COVID19_Epidemiological_Data   # Datenbank in Snowflake
    schema: PUBLIC                           # Schema in dieser Datenbank
    tables:                                  # Tabellen, die wir benutzen wollen
      - name: DEMOGRAPHICS                   # Tabellenname in Snowflake
        description: 'Ceci est un test.'
           # Beschreibung der Tabelle
      - name: APPLE_MOBILITY                # zweite Tabelle aus derselben Quelle
        description: 'switzerland search in APPLE_MOBILITY '
        columns:
          - name: COUNTRY_REGION            # Spalte, die geprüft werden soll
            data_tests:
              - switzerland                 # unser eigener Test  